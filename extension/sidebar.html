<div class="sidebar">
  <div class="sb-header">
    <div class="sb-title">Student Buddy</div>

    <div class="sb-header-actions">
      <button id="sb-settings" class="sb-icon-btn" title="Settings">⚙️</button>
      <button class="sb-close" title="Close">✕</button>
    </div>
  </div>

  <div class="sb-content">
    <button class="sb-btn" id="sb-load-problem">Load problem</button>
    <div id="sb-problem-status">Not loaded</div>
  </div>
  <div class="sb-content">
    <label class="sb-label">Have you attempted the problem?</label>
    <textarea
      class="sb-textarea"
      placeholder="Optional: If you have tried, enter your approach here..."
    ></textarea>
  </div>
  <div class="sb-content sb-row">
    <button class="sb-btn" id="sb-get-hint">Get Hint</button>
    <button class="sb-btn" id="sb-next-hint">Next Hint</button>
  </div>
  <div class="sb-content">
    <label class="sb-label">Select Language: </label>
    <select class="sb-select">
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
    </select>
  </div>
  <div class="sb-content">
    <button class="sb-btn" id="sb-solution">Show Full Solution</button>
  </div>
  <div class="sb-content sb-output-header">
      <label class="sb-label">Output</label>
      <button id="sb-expand-output" class="sb-expand-btn" title="Expand Output">⛶</button>
  </div>

  <div class="sb-output" id="sb-output">
    Load the problem, then ask for hints.
  </div>

  <!-- Output Modal -->
  <div id="sb-output-modal" class="sb-modal">
    <div class="sb-modal-content">
      <div class="sb-modal-header">
        <span>Output</span>
        <button id="sb-close-modal">✕</button>
      </div>
      <div id="sb-modal-output" class="sb-modal-output"></div>
    </div>
  </div>

  <div id="sb-settings-panel" class="sb-settings-panel" style="display:none;">
    <div class="sb-settings-header">
      <span>Settings</span>
      <button id="sb-settings-close">✕</button>
    </div>

    <label class="sb-label">Gemini API Key</label>

    <input
        id="sb-api-key"
        class="sb-input"
        type="password"
        placeholder="Paste your Gemini API Key"
    >

    <button id="sb-save-key" class="sb-btn">
        Save
    </button>

    <div id="sb-save-status"></div>
    <p class="sb-small">Note - Your Gemini API key is stored locally on your device and is only sent to Student Buddy's backend to generate hints and solutions. It is never shared with LeetCode.</p>

  </div>
</div>
